project:
  type: website
  output-dir: _site
  pre-render: scripts/make_handout.py
  post-render: scripts/lock_pages.py
  render:
    - index.qmd
    - exercises.qmd
    - lecture-notes.qmd
    - resources.qmd
    - nuclear.qmd
    - slides/ml4acc.qmd
  resources:
    # only the accelerator notebooks are copied to the website; the nuclear ones are
    # opened from GitHub through the (locked) nuclear page
    - notebooks/00_*.ipynb
    - notebooks/01_*.ipynb
    - notebooks/02_*.ipynb
    - notebooks/03_*.ipynb
    - notebooks/solutions/00_*.ipynb
    - notebooks/solutions/01_*.ipynb
    - notebooks/solutions/02_*.ipynb
    - notebooks/solutions/03_*.ipynb
    - assets/

website:
  title: "ML for Accelerator Physics"
  site-url: https://hayg25.github.io/ML4Accelerators/
  repo-url: https://github.com/hayg25/ML4Accelerators
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Course
      - href: slides/ml4acc.qmd
        text: Slides
      - href: lecture-notes.qmd
        text: Lecture notes
      - href: exercises.qmd
        text: Exercises
      - href: resources.qmd
        text: Learn more
      - href: nuclear.qmd
        text: "ML for nuclear energy 🔒"
    right:
      - icon: github
        href: https://github.com/hayg25/ML4Accelerators
        aria-label: GitHub repository
  page-footer:
    left: "© Hayg Guler — IJCLab (CNRS/IN2P3). Content CC BY 4.0, code MIT."
    right: "Built with [Quarto](https://quarto.org)"

execute:
  eval: false
  freeze: false
