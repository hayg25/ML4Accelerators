project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - exercises.qmd
    - slides/ml4acc.qmd
  resources:
    - notebooks/*.ipynb
    - notebooks/solutions/*.ipynb
    - assets/

website:
  title: "ML for Accelerator Physics"
  site-url: https://hayg25.github.io/Lectures_ML4Accelerators/
  repo-url: https://github.com/hayg25/Lectures_ML4Accelerators
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Course
      - href: slides/ml4acc.qmd
        text: Slides
      - href: exercises.qmd
        text: Exercises
    right:
      - icon: github
        href: https://github.com/hayg25/Lectures_ML4Accelerators
        aria-label: GitHub repository
  page-footer:
    left: "© Hayg Guler — IJCLab (CNRS/IN2P3). Content CC BY 4.0, code MIT."
    right: "Built with [Quarto](https://quarto.org)"

execute:
  eval: false
  freeze: false
